  <nav class="site-nav">
    <div class="nav-logo">A <img src="assets/photos/flower_salmon.png" alt="Arbie and Jerzey"> J</div>
    <button class="hamburger" (click)="menuOpen = !menuOpen" [class.open]="menuOpen">
      <span></span><span></span><span></span>
    </button>
    <div class="nav-links" [class.open]="menuOpen">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="menuOpen = false">home</a>
      <a routerLink="/entourage" routerLinkActive="active" (click)="menuOpen = false">entourage</a>
      <a routerLink="/directions" routerLinkActive="active" (click)="menuOpen = false">directions</a>
      <a routerLink="/attire" routerLinkActive="active" (click)="menuOpen = false">attire</a>
      <a routerLink="/gifts" routerLinkActive="active" (click)="menuOpen = false">gifts</a>

  <main class="site-main">
    <router-outlet />
  </main>

    <p>With love, Arbie &amp; Jerzey &mdash; we can't wait to celebrate with you 🥂</p>
